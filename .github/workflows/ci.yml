name: AegisPay CI & Verification Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-contracts:
    name: Foundry Solidity Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Build Contracts
        run: |
          cd contracts
          forge --version
          forge build

      - name: Run Contract Unit & Fuzz Tests
        run: |
          cd contracts
          forge test -vvv

  test-backend-and-e2e:
    name: Backend Pytest & Full E2E Suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Foundry (for Anvil node)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Start Anvil Node
        run: |
          anvil --host 0.0.0.0 --port 8545 > /tmp/anvil.log 2>&1 &
          sleep 3
          curl -s -X POST -H "Content-Type: application/json" --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' http://127.0.0.1:8545

      - name: Deploy & Seed Contracts
        run: |
          cd contracts
          forge script script/DeployAndSeed.s.sol --rpc-url http://127.0.0.1:8545 --broadcast

      - name: Run Backend Pytest Suite
        run: |
          pytest backend/tests/test_api.py -v

      - name: Start FastAPI Relayer
        run: |
          python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          sleep 3
          curl -s http://127.0.0.1:8000/api/v1/health

      - name: Run 10-Checkpoint E2E Smoke & Adversarial Verification
        run: |
          python scripts/e2e_verify.py

  build-frontend:
    name: Frontend TypeScript Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Production Frontend Bundle
        run: |
          cd frontend
          npm run build
